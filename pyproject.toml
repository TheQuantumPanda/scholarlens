[project]
name = "scholarlens"
version = "0.1.0"
description = "Evidence-grounded multi-paper research synthesis system"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "chromadb>=1.5.9",
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.1.1,<2",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
